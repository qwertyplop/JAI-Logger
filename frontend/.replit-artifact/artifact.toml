kind = "web"
previewPath = "/"
title = "JAI Request Debugger"
version = "1.0.0"
id = "artifacts/request-debugger"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19302

[services.development]
run = "pnpm --filter jai-request-debugger-frontend run dev"

[services.production]
build = [ "pnpm", "--filter", "jai-request-debugger-frontend", "run", "build" ]
publicDir = "artifacts/request-debugger/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19302"
BASE_PATH = "/"
